name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: npm ci

      - run: python -m pip install --no-cache-dir -r services/kryptotron/requirements.lock.txt pytest==8.3.5

      - run: npm run verify

      - run: npm run restore:drill
        env:
          DATABASE_PATH: ${{ runner.temp }}/ocean.db
          BACKUP_DIRECTORY: ${{ runner.temp }}/backups
