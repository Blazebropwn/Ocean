name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Allow the isolation test to create user namespaces
        shell: bash
        run: |
          # Ubuntu restricts unprivileged user namespaces through AppArmor.
          # Give only bwrap the documented application exception on this runner.
          # https://documentation.ubuntu.com/release-notes/24.04/
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] &&
             [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == 1 ]]; then
            sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi

      - run: npm ci

      - run: python -m pip install --no-cache-dir -r services/kryptotron/requirements.lock.txt pytest==8.3.5

      - run: npm run verify

      - run: npm run restore:drill
        env:
          DATABASE_PATH: ${{ runner.temp }}/ocean.db
          BACKUP_DIRECTORY: ${{ runner.temp }}/backups
