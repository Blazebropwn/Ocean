<!doctype html>
<html lang="cs">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram · Ocean</title><meta name="theme-color" content="#041218"><link rel="stylesheet" href="/command-deck.css"></head>
  <body>
    <header class="nav"><a class="brand" href="/">Ocean<span>.</span></a><a class="result-link back-link" href="/">← Přehled</a></header>
    <main class="invite-page utility-page">
      <section class="invite-shell telegram-shell utility-shell">
        <div class="utility-identity">
          <div class="utility-mark telegram-mark" aria-hidden="true"><i></i></div>
          <div><small>KOMUNIKAČNÍ KANÁL</small><h1>Telegram</h1></div>
          <span id="telegram-state">—</span>
        </div>
        <div id="telegram-disconnected" class="telegram-panel">
          <div><strong>Připojte svůj Telegram</strong><small>Výsledky a důležitá upozornění dostanete přímo do chatu.</small></div>
          <button class="primary telegram-primary" id="create-telegram-code" type="button">Propojit Telegram</button>
          <div class="telegram-code hidden" id="telegram-code"><span>PÁROVACÍ KÓD</span><strong id="pairing-code"></strong><small>Platí 10 minut</small><a id="telegram-open" target="_blank" rel="noopener">Otevřít Ocean Control →</a><code id="pairing-command"></code></div>
        </div>
        <div class="telegram-panel telegram-connected hidden" id="telegram-connected">
          <div class="connection-state"><i aria-hidden="true"></i><div><small>PŘIPOJENÝ ÚČET</small><strong id="telegram-account">Propojeno</strong></div></div>
          <div class="telegram-capability"><span>Upozornění</span><strong>Aktivní</strong></div>
          <div class="telegram-capability"><span>Ovládání</span><strong>/status · /pause</strong></div>
          <button class="danger-link" id="disconnect-telegram" type="button">Odpojit Telegram</button>
        </div>
        <p class="message" id="telegram-message" role="alert"></p>
      </section>
    </main>
    <script src="/telegram.js" defer></script>
  </body>
</html>
