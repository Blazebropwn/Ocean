<!doctype html>
<html lang="cs">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pozvánky · Ocean</title><meta name="theme-color" content="#041218"><link rel="stylesheet" href="/command-deck.css?v=8"></head>
  <body>
    <header class="nav"><a class="brand" href="/">Ocean<span>.</span></a><a class="result-link" href="/">Zpět do Oceanu</a></header>
    <main class="invite-page">
      <section class="invite-shell">
        <div class="invite-head"><div><small>SOUKROMÝ PŘÍSTUP</small><h1>Pozvánky</h1></div><span>OWNER</span></div>
        <form class="invite-create" id="invite-form"><label>E-mail člena <small>nepovinné</small><input name="email" type="email" placeholder="pritel@example.com"></label><button class="primary" type="submit">Vytvořit pozvánku</button></form>
        <div class="invite-result hidden" id="invite-result"><input id="invite-url" readonly><button id="copy-invite" type="button">Kopírovat</button></div>
        <p class="message" id="invite-message" role="alert"></p>
        <div class="invite-list-head"><strong>Poslední pozvánky</strong><small>Platnost 7 dní · jednorázové</small></div>
        <div class="invite-list" id="invite-list"><p>Načítám…</p></div>
        <div class="invite-list-head"><strong>Členové</strong><small>Ruční schválení přístupu</small></div>
        <div class="invite-list" id="member-list"><p>Načítám…</p></div>
        <div class="invite-result hidden" id="member-reset-result"><input id="member-reset-url" readonly><button id="copy-member-reset" type="button">Kopírovat</button></div>
      </section>
    </main>
    <script src="/invites.js?v=4" defer></script>
  </body>
</html>
