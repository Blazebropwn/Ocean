<!doctype html>
<html lang="cs">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Správa · Ocean</title><meta name="theme-color" content="#041218"><link rel="stylesheet" href="/command-deck.css"></head>
  <body>
    <header class="nav"><a class="brand" href="/">Ocean<span>.</span></a><a class="result-link back-link" href="/">← Přehled</a></header>
    <main class="invite-page utility-page admin-page">
      <section class="admin-shell">
        <div class="admin-heading"><div><small>OWNER CONTROL</small><h1>Správa účtů</h1></div><span>CHRÁNĚNÝ PŘÍSTUP</span></div>
        <section class="admin-section invite-create-section">
          <div class="section-heading"><div><small>NOVÝ ČLEN</small><h2>Vytvořit pozvánku</h2></div><span>Platnost 7 dní</span></div>
          <form class="invite-create" id="invite-form"><label>E-mail <small>nepovinné</small><input name="email" type="email" placeholder="pritel@example.com"></label><button class="primary" type="submit">Vytvořit pozvánku</button></form>
          <div class="invite-result hidden" id="invite-result"><input id="invite-url" readonly><button id="copy-invite" type="button">Kopírovat</button></div>
          <p class="message" id="invite-message" role="alert"></p>
        </section>
        <div class="admin-columns">
          <section class="admin-section">
            <div class="invite-list-head"><strong>Pozvánky</strong><small>Jednorázové odkazy</small></div>
            <div class="invite-list" id="invite-list"><p>Načítám…</p></div>
          </section>
          <section class="admin-section members-section">
            <div class="invite-list-head"><strong>Členové</strong><small>Účty a automatizace</small></div>
            <div class="invite-list" id="member-list"><p>Načítám…</p></div>
            <div class="invite-result hidden" id="member-reset-result"><input id="member-reset-url" readonly><button id="copy-member-reset" type="button">Kopírovat</button></div>
          </section>
        </div>
      </section>
    </main>
    <script src="/invites.js" defer></script>
  </body>
</html>
